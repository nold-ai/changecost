name: Repository quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Full comparison commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.15', '3.13.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned bootstrap tools
        run: |
          python -m pip install uv==0.12.19
          npm install --global @fission-ai/openspec@1.13.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          uv tool install specfact-cli==0.55.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Resolve comparison base
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.comparison_base }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          case "$EVENT" in
            pull_request) base=$(git merge-base HEAD "$PR_BASE") ;;
            push) base=$PUSH_BASE ;;
            workflow_dispatch) base=$MANUAL_BASE ;;
            *) exit 1 ;;
          esac
          resolved=$(git rev-parse --verify --end-of-options "$base^{commit}")
          echo "BASE_REF=$resolved" >> "$GITHUB_ENV"
      - name: Install locked project environment
        run: uv sync --locked --group build
      - name: Install pinned review module
        run: specfact module install nold-ai/specfact-code-review --version 0.50.1
      - name: Allow namespaces for this job's capsule launcher paths
        id: capsule-userns
        env:
          SPECFACT_CODE_REVIEW_CAPSULE_CACHE: ${{ runner.temp }}/changecost-capsules
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          test "$SPECFACT_CODE_REVIEW_CAPSULE_CACHE" = "$RUNNER_TEMP/changecost-capsules"
          echo "SPECFACT_CODE_REVIEW_CAPSULE_CACHE=$SPECFACT_CODE_REVIEW_CAPSULE_CACHE" >> "$GITHUB_ENV"
          mkdir -p "$SPECFACT_CODE_REVIEW_CAPSULE_CACHE"
          profile="$RUNNER_TEMP/changecost-capsule.apparmor"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile changecost-capsule "$SPECFACT_CODE_REVIEW_CAPSULE_CACHE/**/opt/specfact/bin/bwrap-static" flags=(unconfined) {
            userns,
          }
          EOF
          # Cache paths are not an authentication boundary on this disposable sudo-capable VM.
          # Only policy installation is administrative; analysis stays unprivileged.
          sudo apparmor_parser -r "$profile"
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
      - name: Check repository
        run: env -u MAKEFLAGS -u GNUMAKEFLAGS -u MFLAGS make check
      - name: Preserve native review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-evidence-${{ matrix.python }}
          path: |
            .specfact/code-review*.json
            .specfact/review-binding.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Remove job-local capsule profile
        if: always()
        shell: bash
        run: |
          profile="$RUNNER_TEMP/changecost-capsule.apparmor"
          if test -f "$profile"; then
            sudo apparmor_parser -R "$profile"
          fi
