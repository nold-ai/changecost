name: Frozen signed 0.51.2 candidate assurance

on:
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Frozen comparison commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.15', '3.13.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 71518ca866b565f70b3943ec1e76053b9ef2b5eb
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned bootstrap tools
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          python -m pip install uv==0.12.19
          npm install --global @fission-ai/openspec@1.13.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          uv tool install specfact-cli==0.55.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Resolve comparison base
        env:
          UV_PYTHON: ${{ matrix.python }}
          EXPECTED_HEAD: 71518ca866b565f70b3943ec1e76053b9ef2b5eb
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.comparison_base }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          case "$EVENT" in
            pull_request) base=$(git merge-base HEAD "$PR_BASE") ;;
            push) base=$PUSH_BASE ;;
            workflow_dispatch) base=$MANUAL_BASE ;;
            *) exit 1 ;;
          esac
          resolved=$(git rev-parse --verify --end-of-options "$base^{commit}")
          if test "$EVENT" = workflow_dispatch; then
            test "$resolved" != "$EXPECTED_HEAD"
          fi
          echo "BASE_REF=$resolved" >> "$GITHUB_ENV"
      - name: Install locked project environment
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: uv sync --locked --group build
      - name: Install pinned review module
        env:
          UV_PYTHON: ${{ matrix.python }}
          SPECFACT_REGISTRY_INDEX_URL: https://raw.githubusercontent.com/nold-ai/specfact-cli-modules/209b4ed835187ea857d1fa847abdd351f6f6232a/registry/index.json
        run: specfact module install nold-ai/specfact-code-review --version 0.51.2
      - name: Allow namespaces for this job's capsule launcher paths
        id: capsule-userns
        env:
          UV_PYTHON: ${{ matrix.python }}
          SPECFACT_CODE_REVIEW_CAPSULE_CACHE: ${{ runner.temp }}/changecost-capsules
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          test "$SPECFACT_CODE_REVIEW_CAPSULE_CACHE" = "$RUNNER_TEMP/changecost-capsules"
          echo "SPECFACT_CODE_REVIEW_CAPSULE_CACHE=$SPECFACT_CODE_REVIEW_CAPSULE_CACHE" >> "$GITHUB_ENV"
          mkdir -p "$SPECFACT_CODE_REVIEW_CAPSULE_CACHE"
          profile="$RUNNER_TEMP/changecost-capsule.apparmor"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile changecost-capsule "$SPECFACT_CODE_REVIEW_CAPSULE_CACHE/**/opt/specfact/bin/bwrap-static" flags=(unconfined) {
            userns,
          }
          EOF
          # Cache paths are not an authentication boundary on this disposable sudo-capable VM.
          # Only policy installation is administrative; analysis stays unprivileged.
          sudo apparmor_parser -r "$profile"
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
      - name: Observe bounded host resource context
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          .venv/bin/python - <<'PY'
          import json
          from quality.runtime_diagnostics import host_context
          print(json.dumps(host_context(), sort_keys=True))
          PY
      - name: Check repository
        id: repository-check
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: /usr/bin/env -u MAKEFLAGS -u GNUMAKEFLAGS -u MFLAGS /usr/bin/make check
      - name: Diagnose selected review-session tests after failure
        if: failure() && steps.repository-check.outcome == 'failure'
        env:
          UV_PYTHON: ${{ matrix.python }}
        # This selected report never replaces the failed complete-suite gate.
        run: >-
          specfact code review run tests/test_review_session.py
          --include-tests --bug-hunt --enforcement full --json
          --out .specfact/selected-review-session-diagnostic.json
      - name: Collect privacy-safe runtime metadata
        if: always()
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: .venv/bin/python -m quality.runtime_diagnostics .specfact/code-review.json "$HOME/.cache/specfact/code-review/project-runtimes-v2" .specfact/runtime-diagnostic.json
      - name: Bind effective official candidate adapter
        if: always()
        run: |
          .venv/bin/python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['SPECFACT_CODE_REVIEW_CAPSULE_CACHE'])
          suffix = 'opt/specfact/builtin/specfact_code_review/run/target_pylint.py'
          entries = []
          for path in root.rglob('target_pylint.py'):
              if path.as_posix().endswith(suffix):
                  entries.append({'path':str(path.relative_to(root)), 'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
                  assert len(entries) <= 128
          result = {'expected_adapter_sha256':'62f4855a347c857039b7741448a770f7a7aa063dfca52417c552d662c2984c90','entries':entries,'source_head':'71518ca866b565f70b3943ec1e76053b9ef2b5eb','module':'0.51.2','installed_cli':'0.55.4','registry_ref':'209b4ed835187ea857d1fa847abdd351f6f6232a','limits':'Official signed candidate only; primary PR gate not replaced. Native30/300/checkers/files unchanged.'}
          Path('.specfact/candidate-adapter-binding.json').write_text(json.dumps(result,indent=2)+'\n')
          assert entries and all(item['sha256']==result['expected_adapter_sha256'] for item in entries)
          PY
      - name: Preserve native review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-evidence-${{ matrix.python }}
          path: |
            .specfact/code-review*.json
            .specfact/review-binding.json
            .specfact/runtime-diagnostic.json
            .specfact/native-process-*.json
            .specfact/selected-review-session-diagnostic.json
            .specfact/candidate-adapter-binding.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Remove job-local capsule profile
        env:
          UV_PYTHON: ${{ matrix.python }}
        if: always()
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          profile="$RUNNER_TEMP/changecost-capsule.apparmor"
          if test -f "$profile"; then
            sudo apparmor_parser -R "$profile"
          fi
