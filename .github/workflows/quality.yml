name: Repository quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Full comparison commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.15', '3.13.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned bootstrap tools
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          python -m pip install uv==0.12.19
          npm install --global @fission-ai/openspec@1.13.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          uv tool install specfact-cli==0.55.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Resolve comparison base
        env:
          UV_PYTHON: ${{ matrix.python }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.comparison_base }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          case "$EVENT" in
            pull_request) base=$(git merge-base HEAD "$PR_BASE") ;;
            push) base=$PUSH_BASE ;;
            workflow_dispatch) base=$MANUAL_BASE ;;
            *) exit 1 ;;
          esac
          resolved=$(git rev-parse --verify --end-of-options "$base^{commit}")
          if test "$EVENT" = workflow_dispatch; then
            test "$resolved" != "$EXPECTED_HEAD"
          fi
          echo "BASE_REF=$resolved" >> "$GITHUB_ENV"
      - name: Install locked project environment
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: uv sync --locked --group build
      - name: Install pinned review module
        env:
          UV_PYTHON: ${{ matrix.python }}
          SPECFACT_REGISTRY_INDEX_URL: https://raw.githubusercontent.com/nold-ai/specfact-cli-modules/209b4ed835187ea857d1fa847abdd351f6f6232a/registry/index.json
        run: specfact module install nold-ai/specfact-code-review --version 0.51.2
      - name: Allow namespaces for this job's capsule launcher paths
        id: capsule-userns
        env:
          UV_PYTHON: ${{ matrix.python }}
          SPECFACT_CODE_REVIEW_CAPSULE_CACHE: ${{ runner.temp }}/changecost-capsules
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          test "$SPECFACT_CODE_REVIEW_CAPSULE_CACHE" = "$RUNNER_TEMP/changecost-capsules"
          echo "SPECFACT_CODE_REVIEW_CAPSULE_CACHE=$SPECFACT_CODE_REVIEW_CAPSULE_CACHE" >> "$GITHUB_ENV"
          mkdir -p "$SPECFACT_CODE_REVIEW_CAPSULE_CACHE"
          profile="$RUNNER_TEMP/changecost-capsule.apparmor"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile changecost-capsule "$SPECFACT_CODE_REVIEW_CAPSULE_CACHE/**/opt/specfact/bin/bwrap-static" flags=(unconfined) {
            userns,
          }
          EOF
          # Cache paths are not an authentication boundary on this disposable sudo-capable VM.
          # Only policy installation is administrative; analysis stays unprivileged.
          sudo apparmor_parser -r "$profile"
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
      - name: Observe bounded host resource context
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          .venv/bin/python - <<'PY'
          import json
          from quality.runtime_diagnostics import host_context
          print(json.dumps(host_context(), sort_keys=True))
          PY
      - name: Start temporary native stack diagnostic
        continue-on-error: true
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          uv tool install py-spy==0.4.1
          cat > "$RUNNER_TEMP/native-stack-probe.py" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time

          root = Path.cwd().resolve()
          sys.path.insert(0, str(root))
          from quality.runtime_diagnostics import directory, process_tree, read_process

          spy = str(Path(sys.argv[1]).resolve())
          stop = Path(os.environ["RUNNER_TEMP"]) / "native-stack-probe.stop"
          output = root / ".specfact/native-stack-profile.json"
          output.parent.mkdir(exist_ok=True)
          started = time.monotonic()
          report = {"schema": "changecost/native-stack-profile-v1", "samples": []}
          marker = ["code", "review", "run", "--scope", "full", "--include-tests",
                    "--bug-hunt", "--enforcement", "full", "--json", "--out"]
          identity = None
          next_sample = 0.0
          roles = ("pylint", "coverage", "pytest", "crosshair", "mypy", "bandit", "ruff")
          while time.monotonic() - started < 900 and not stop.exists():
              if identity is None:
                  for folder in list(Path("/proc").iterdir())[:512]:
                      if not folder.name.isdigit():
                          continue
                      try:
                          with (folder / "cmdline").open("rb") as source:
                              args = source.read(16385).decode().rstrip("\0").split("\0")
                          if len(args) > 16 or args[-12:-1] != marker:
                              continue
                          if not any(Path(a).name == "specfact" for a in args[:-12]):
                              continue
                          if Path(os.readlink(folder / "cwd")).resolve() != root:
                              continue
                          if not re.fullmatch(re.escape(str(root)) + r"/\.specfact/code-review-[0-9a-f]{32}\.json", args[-1]):
                              continue
                          with directory(Path("/proc")) as proc:
                              row = read_process(proc, folder.name)
                          identity = (row["pid"], row["start_ticks"])
                          report["root_pid"], report["root_start_ticks"] = identity
                          break
                      except (OSError, ValueError, UnicodeError):
                          continue
              elapsed = time.monotonic() - started
              if identity is not None and elapsed >= next_sample:
                  tree = process_tree(*identity)
                  if not tree["root_valid"]:
                      break
                  sample = {"elapsed_seconds": round(elapsed, 3), "processes": []}
                  rows = sorted(tree["processes"], key=lambda row: (row["state"] != "R", -row["cpu_ticks"]))
                  for row in rows:
                      if len(sample["processes"]) >= 8:
                          break
                      folder = Path("/proc") / str(row["pid"])
                      try:
                          with (folder / "cmdline").open("rb") as source:
                              args = source.read(16384).decode(errors="replace").split("\0")
                          if not any(Path(arg).name.startswith("python") for arg in args[:4]):
                              continue
                          role = next((r for r in roles if any(a == r or Path(a).name == r for a in args)), "python")
                          with directory(Path("/proc")) as proc:
                              if read_process(proc, str(row["pid"]))["start_ticks"] != row["start_ticks"]:
                                  continue
                          entry = {"pid": row["pid"], "start_ticks": row["start_ticks"], "role": role, "frames": []}
                          sample["processes"].append(entry)
                          # Timeout runs under sudo so it can terminate its privileged child.
                          result = subprocess.run(
                              ["sudo", "-n", "/usr/bin/timeout", "--signal=KILL", "2s",
                               spy, "dump", "--json", "--nonblocking", "--pid", str(row["pid"])],
                              stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=3, check=False,
                          )
                          if result.returncode or len(result.stdout) > 1048576:
                              continue
                          traces = json.loads(result.stdout)
                          for trace in traces[:4]:
                              for frame in trace.get("frames", [])[:32]:
                                  name, filename, line = frame.get("name"), frame.get("filename"), frame.get("line")
                                  if not isinstance(name, str) or not isinstance(filename, str) or type(line) is not int:
                                      continue
                                  entry["frames"].append({"function": name[:120], "file": "/".join(Path(filename).parts[-4:])[:240], "line": line})
                      except (OSError, ValueError, TypeError, AttributeError, subprocess.TimeoutExpired):
                          continue
                  report["samples"].append(sample)
                  raw = json.dumps(report).encode()
                  if len(raw) > 1048576:
                      report["samples"].pop()
                      break
                  output.write_bytes(raw)
                  if len(report["samples"]) >= 24:
                      break
                  next_sample = elapsed + 20
              time.sleep(2)
          if not output.exists():
              output.write_text(json.dumps(report))
          PY
          rm -f "$RUNNER_TEMP/native-stack-probe.stop"
          nohup /usr/bin/timeout --signal=TERM 900s .venv/bin/python "$RUNNER_TEMP/native-stack-probe.py" "$(command -v py-spy)" </dev/null >/dev/null 2>&1 &
      - name: Check repository
        id: repository-check
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: /usr/bin/env -u MAKEFLAGS -u GNUMAKEFLAGS -u MFLAGS /usr/bin/make check
      - name: Stop temporary native stack diagnostic
        if: always()
        continue-on-error: true
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: touch "$RUNNER_TEMP/native-stack-probe.stop"
      - name: Diagnose selected review-session tests after failure
        if: failure() && steps.repository-check.outcome == 'failure'
        env:
          UV_PYTHON: ${{ matrix.python }}
        # This selected report never replaces the failed complete-suite gate.
        run: >-
          specfact code review run tests/test_review_session.py
          --include-tests --bug-hunt --enforcement full --json
          --out .specfact/selected-review-session-diagnostic.json
      - name: Collect privacy-safe runtime metadata
        if: always()
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: .venv/bin/python -m quality.runtime_diagnostics .specfact/code-review.json "$HOME/.cache/specfact/code-review/project-runtimes-v2" .specfact/runtime-diagnostic.json
      - name: Preserve native review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-evidence-${{ matrix.python }}
          path: |
            .specfact/code-review*.json
            .specfact/review-binding.json
            .specfact/runtime-diagnostic.json
            .specfact/native-process-*.json
            .specfact/native-stack-profile.json
            .specfact/selected-review-session-diagnostic.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Remove job-local capsule profile
        env:
          UV_PYTHON: ${{ matrix.python }}
        if: always()
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          profile="$RUNNER_TEMP/changecost-capsule.apparmor"
          if test -f "$profile"; then
            sudo apparmor_parser -R "$profile"
          fi
