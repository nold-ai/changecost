schema: spec-driven

context: |
  Core-02 merged in PR #25 on 2026-09-29 and is archived with synchronized main specs.
  Offline contracts, bind, lifecycle-only settle and explain are delivered on main.
  Normalized reconciliation merged in PR #28 on 2026-10-02 and is accepted/archived
  with synchronized main specs; final verification and limitations remain archived.
  No provider adapter is delivered. Quote #15 runtime implementation was authorized on
  2026-10-03; this checkout includes offline synthetic empirical Quotes, pending verification.
  ChangeCost (nold-ai/changecost) is a standalone NOLD AI project exploring
  cost estimates and settlement for AI-assisted software changes.
  Phase: unreleased 0.x alpha/preview feasibility study; private; Apache-2.0.
  All approved pilot changes belong to the first pre-v1 product; no version is published.
  Keep package 0.1.0.dev0 and evolve current internal schemas without a public v2
  compatibility programme; schema labels do not imply released product versions.
  Initial authorization: nine OpenSpec plans and linked GitHub backlog.
  Subsequent authorization on 2026-09-28: implement source-feasibility research,
  extend it to Codex/Claude Code metrics, and inspect existing local artifacts.
  Enterprise Cursor/Copilot projections are also authorized comparison evidence.
  V2 adds reported message counters and synthetic examples, not verified native imports.
  Local metadata provides partial evidence. Work OTel is reported globally disabled;
  custom session-log hook output is the next source to inspect, not OTel enablement.
  Additional product implementation and live telemetry collection require a separate request.
  Foundation merged in PR #22 on 2026-09-28; bounded-review workflow merged in
  PR #24 on 2026-09-29. Both are archived with synchronized main specs. Core-02
  contracts/lifecycle is archived; settlement reconciliation implementation was authorized on 2026-09-29.
  Selected defaults: Python 3.11+, Typer, Pydantic, SQLite, Decimal; uv/Hatchling,
  pytest, Ruff, BasedPyright. Personal Cursor/Copilot IDE and CLI use is the pilot.
  Plan quote, bind, settle, check, explain and changecost/v1 portable artifacts.
  Proposed loop: quote -> bind -> meter -> settle -> calibrate.
  Research is input, not an approved specification or proof of provider capability.
  Treat provider charges, credits, raw usage, and estimated cost distinctly.
  Make uncertainty, unbound spend, and missing evidence visible. Use synthetic data.
  Minimize data retention; no prompts, source transcripts, or employee scoring.
  Keep the project small: no gateway, dashboard, custom price database, hash-chain
  ledger, plugin framework, or ML platform in the bootstrap.
  SpecFact is development tooling, not a runtime dependency. A later integration
  should consume a proven standalone contract.
  Read AGENTS.md, docs/project-brief.md, docs/research/README.md, and applicable
  docs/agent-rules/ before changes. No sibling repository is required.
  Behavior changes follow spec -> failing tests -> implementation -> passing tests,
  with actual TDD_EVIDENCE.md. Pure docs/scaffold changes need relevant checks only.
  Current gate: make check with explicit BASE_REF and an intended-file manifest
  for untracked inputs. Foundation adds format/lint/type/test, package, docs,
  generated-index, metadata, workflow and dependency gates. Final hosted Linux
  assurance passed for both delivered changes; accepted foundation verifier risks
  and unvalidated reviewer calibration remain documented. The current macOS
  controller cannot run capsules; new behavior still needs fresh Linux assurance.
  Missing/skipped analyzers are failures, not passes. See archived TDD evidence.
  Advisory budget CI never waives repository quality gates; publishing/deployment
  remains out of scope.
  Prefer clear names, KISS, YAGNI, DRY, and proportionate SOLID; no speculative layers.
  For the four-stage change workflow, read docs/agent-rules/30-change-workflow.md.
  Refresh main before preparation/implementation; reconcile prepared artifacts by
  change identity. Keep functions and branches simple; minimum code must still
  satisfy every required scenario. Update docs, changelog and llms.txt as applicable.
  Keep documentation in English. Do not change repository visibility or publish
  packages/sites without explicit authorization.

rules:
  proposal:
    - Include Why, What Changes, Capabilities, Impact, and Non-goals.
    - Separate confirmed requirements from research hypotheses and open decisions.
    - Name affected docs, verification, material risks, and a proportionate rollback.
    - Do not add implementation scope merely because it appears in the research.
  specs:
    - Use Given/When/Then scenarios as the source of meaningful behavior tests.
    - Define units, rounding, missing data, attribution, and retries where applicable.
    - Make uncertainty and insufficient-evidence behavior explicit when quoting costs.
    - Use synthetic fixtures; include privacy and offline behavior where applicable.
  design:
    - Choose the smallest design that satisfies approved scope; justify dependencies.
    - Verify provider interfaces against current primary sources before adopting them.
    - Keep runtime independent of SpecFact; document trust boundaries and failure modes.
  tasks:
    - Order behavior work as branch, specs, failing tests, implementation, passing tests.
    - Record actual commands, timestamps, and outcomes in TDD_EVIDENCE.md for behavior changes.
    - Include applicable quality gates and fresh SpecFact review; resolve or justify findings.
    - Include documentation updates, strict OpenSpec validation, and a focused PR.
    - For foundation/workflow changes, include executable docs ownership/consistency, llms integrity and changelog/version checks with negative fixtures and local/CI parity; keep planned versus active gates explicit.
    - Verify documentation and llms.txt against current behavior; versions change only when applicable, not for planning.
    - Keep Epic/Feature/User Story source tracking and native dependencies aligned with CHANGE_ORDER.md; no module signing or release bumps for planning.
