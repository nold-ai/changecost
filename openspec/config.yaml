rules:
  proposal:
    - Include Why, What Changes, Capabilities, Impact, and Non-goals.
    - Separate confirmed requirements from research hypotheses and open decisions.
    - Name affected docs, verification, material risks, and a proportionate rollback.
    - Do not add implementation scope merely because it appears in the research.
  specs:
    - Use Given/When/Then scenarios as the source of meaningful behavior tests.
    - Define units, rounding, missing data, attribution, and retries where applicable.
    - Make uncertainty and insufficient-evidence behavior explicit when quoting costs.
    - Use synthetic fixtures; include privacy and offline behavior where applicable.
  design:
    - Choose the smallest design that satisfies approved scope; justify dependencies.
    - Verify provider interfaces against current primary sources before adopting them.
    - Keep runtime independent of SpecFact; document trust boundaries and failure modes.
  tasks:
    - Order behavior work as branch, specs, failing tests, implementation, passing tests.
    - Record actual commands, timestamps, and outcomes in TDD_EVIDENCE.md for behavior changes.
    - Include applicable quality gates and fresh SpecFact review; resolve or justify findings.
    - Include documentation updates, strict OpenSpec validation, and a focused PR.
    - For foundation/workflow changes, include executable docs ownership/consistency, llms integrity and changelog/version checks with negative fixtures and local/CI parity; keep planned versus active gates explicit.
    - Verify documentation and llms.txt against current behavior; versions change only when applicable, not for planning.
    - Keep Epic/Feature/User Story source tracking and native dependencies aligned with CHANGE_ORDER.md; no module signing or release bumps for planning.
