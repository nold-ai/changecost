minimum_pre_commit_version: '4.0.0'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^docs/research/deep-research-(report\.md|sources\.txt)$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^docs/research/deep-research-(report\.md|sources\.txt)$
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^docs/research/deep-research-(report\.md|sources\.txt)$
  - repo: local
    hooks:
      - id: repository-contracts
        name: Repository contracts (complete staged snapshot)
        entry: uv run --locked python -m quality staged
        language: system
        always_run: true
        pass_filenames: false
      - id: specfact-code-review
        name: SpecFact full review
        entry: uv run --locked python -m quality review
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
